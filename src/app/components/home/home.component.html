<div class="bg-tertiary flex flex-col h-screen" xmlns="http://www.w3.org/1999/html">
    <app-nav-bar></app-nav-bar>

    <div class="flex-1 flex justify-center items-center px-[10rem] max-tabletLg:px-5 gap-8">

        <div class="flex flex-col gap-4 max-w-[50%]">
            <div class="text-[2.5rem] max-laptop:text-[2rem] max-laptopSm:text-[1.5rem] max-tabletLg:text-[1rem] font-bold">
                Hi!
            </div>

            <div class="text-[3rem] max-laptop:text-[2rem] max-laptopSm:text-[1.5rem] max-tabletLg:text-[1rem]">
                <span class="text-primary font-extrabold">Szymon Półtorak</span>
            </div>

            <div class="flex items-center text-[2.5rem] max-laptop:text-[1.5rem] max-laptopSm:text-[1rem] font-mono">
                I'm&nbsp;
                <span class="relative inline-block whitespace-nowrap font-semibold text-primary font-mono">
                    {{ typed }}<span class="cursor-blink ml-1">|</span>
                </span>
            </div>

            <div class="flex gap-4">
                <a mat-mini-fab aria-label="Linkedin" matTooltip="Contact me on Linkedin"
                   [matTooltipPosition]="'above'" [matTooltipShowDelay]="500"
                   class="fab-button"
                   href="https://www.linkedin.com/in/szymon-poltorak" target="_blank">
                    <ng-icon name="bootstrapLinkedin"/>
                </a>

                <a mat-mini-fab aria-label="Github" matTooltip="See my github projects"
                   [matTooltipPosition]="'above'" [matTooltipShowDelay]="500"
                   class="fab-button"
                   href="https://github.com/szymonpoltorak" target="_blank">
                    <ng-icon name="bootstrapGithub"/>
                </a>

                <a mat-mini-fab aria-label="Mail Me" matTooltip="Send me an email"
                   [matTooltipPosition]="'above'" [matTooltipShowDelay]="500"
                   class="fab-button"
                   href="mailto:szymonpotorak@gmail.com">
                    <mat-icon>mail</mat-icon>
                </a>
            </div>

            <div class="">
                <a mat-fab extended aria-label="CV" matTooltip="Check out my CV"
                   href="assets/Szymon_Poltorak_FullStack_Java_Angular.pdf"
                   [matTooltipPosition]="'above'" [matTooltipShowDelay]="500" target="_blank">
                    <mat-icon>attach_file</mat-icon>

                    <span class="max-navbarMax:hidden">See&nbsp;</span><span class="max-navbarMax:capitalize">my</span> CV
                </a>
            </div>
        </div>

        <div
            class="flex justify-end items-end border-6 rounded-full solid
            max-laptop:max-w-[35rem] max-laptop:max-h-[35rem] max-laptopSm:max-w-[20rem] max-laptopSm:max-h-[20rem]
            max-tabletLg:max-w-[15rem] max-tabletLg:max-h-[15rem]
            border-primary overflow-hidden bg-primary shadow-xl shadow-primary">
            <img
                src="assets/photo.png"
                alt="Profile image"
                class="object-cover"
            />
        </div>
    </div>
</div>
