<div class="bg-tertiary flex flex-col justify-center items-center p-12">
    <div id="technologies" class="font-bold text-[4rem] max-laptop:text-[2rem] max-md:text-lg hide">
        Used <span class="text-primary">Technologies</span>
    </div>

    <div class="grid gap-24 max-navbarMax:gap-10 max-sm:gap-5 w-full p-12 max-navbarMax:p-4 hide max-sm:grid-cols-2"
         style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">

        @for (card of techCards; track card) {
            <div class="flex flex-col justify-evenly items-center sm:gap-2 bg-secondary hover:bg-primary hover:text-black hover:cursor-pointer
                max-navbarMax:p-4 p-12 rounded-2xl hover:shadow-xl hover:shadow-primary
                min-w-48 min-h-48 max-laptop:min-h-24 max-laptop:min-w-24 max-sm:min-w-14 max-sm:min-h-14">

                <img alt="{{ card.name }}"
                     class="max-navbarMax:max-w-14 max-navbarMax:max-h-14 max-sm:max-w-8 max-sm:max-h-8"
                     [src]="card.imageLink">

                <div class="font-semibold text-md max-laptop:text-[1rem] flex flex-col items-center justify-center">
                    {{ card.name }}
                </div>
            </div>
        }
    </div>
</div>
