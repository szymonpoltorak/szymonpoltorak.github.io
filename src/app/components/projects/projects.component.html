<div class="flex flex-col items-center justify-center bg-tertiary min-h-[75%] gap-8 p-2">
    <div id="projects" class="font-bold text-[4rem] hide max-laptop:text-[2rem]">
        Latest <span class="text-primary font-extrabold">Projects</span>
    </div>

    <div class="laptopSm:flex laptopSm:justify-center laptopSm:items-center max-laptopSm:grid max-laptopSm:grid-cols-2 max-md:grid-cols-1
        gap-24 max-laptopSm:gap-12 max-laptopSm:place-items-center w-full p-6 hide">

        @for (project of projects; track project) {
            <div class="flex flex-col justify-evenly items-center gap-2 bg-secondary rounded-2xl
                w-[40rem] h-[40rem] max-laptopSm:max-w-[20rem] max-md:w-[17rem]">

                <div class="flex justify-center items-center flex-col font-semibold text-[2rem] p-2">
                    <span class="font-semibold text-[2rem]">{{ project.title }}</span>
                    <div class="font-light text-sm">
                        {{ project.startDate }}
                        - {{ project.endDate === null ? 'Present' : project.endDate | date: 'MMMM yyyy' }}
                    </div>
                </div>

                <img alt="{{ project.title }}"
                     [src]="project.imageLink">

                <div class="font-semibold pt-2 pl-4 pr-4 text-justify">{{ project.description }}</div>

                <div class="flex items-center justify-center pb-4">
                    <button extended mat-fab>
                        <a href="{{ project.githubLink }}" target="_blank">Read more</a>
                    </button>
                </div>
            </div>
        }
    </div>
</div>
